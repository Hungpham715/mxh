# Curated gazetteer of NLP entities for the rule/dictionary NER baseline (enrichment pipeline).
#
# Conventions:
#   - A plain string entry is a case-INsensitive name with no extra aliases.
#   - A mapping entry may add: aliases (extra surface forms), case_sensitive (true when the
#     lowercase spelling is a common English word, e.g. OPT / DROP / whisper / llama),
#     id (canonical slug override; default = slugified name), and match_name=false when the
#     display name itself is too broad and only explicit aliases should match.
#   - The entity id becomes "<type>:<slug>", e.g. method:bert, dataset:squad, task:summarization.
#   - Matching is longest-alias-first with word boundaries, so "GPT-4" wins over "GPT" and
#     "CNN/DailyMail" wins over "CNN".
#
# Provenance: hand-curated by the project team from domain knowledge of the 2023-2025 NLP/LLM
# literature (the corpus scope in configs/scope.yaml). No external service was used.
gazetteer_version: gazetteer-v1.2

